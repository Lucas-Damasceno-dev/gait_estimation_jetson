imu_node:
  ros__parameters:
    # Taxa de amostragem/publicação em ms
    update_rate_ms: 60

    # Configuração atual: 1 IMU conectada fisicamente (endereço 40 decimal = 0x28)
    names: ["imu_bottom"]
    ids: [1]
    multiplexer: [0]
    addresses: [40]

    # ARQUITETURA MULTIPLEXADA (2 IMUs por canal binário do Multiplexador Analógico):
    # Canal 0 (00 binário): Pinos S1=0, S0=0 -> Endereços 40 (0x28) e 41 (0x29)
    # Canal 1 (01 binário): Pinos S1=0, S0=1 -> Endereços 40 (0x28) e 41 (0x29)
    # Canal 2 (10 binário): Pinos S1=1, S0=0 -> Endereços 40 (0x28) e 41 (0x29)
    # Canal 3 (11 binário): Pinos S1=1, S0=1 -> Endereços 40 (0x28) e 41 (0x29)
    #
    # Exemplo para 4 IMUs (2 canais multiplexados):
    # names: ["imu_tibia_l", "imu_femur_l", "imu_tibia_r", "imu_femur_r"]
    # ids: [1, 2, 3, 4]
    # multiplexer: [0, 0, 1, 1]   # 0 = canal '00', 1 = canal '01'
    # addresses: [40, 41, 40, 41] # 40 = 0x28 (GND), 41 = 0x29 (3.3V)
